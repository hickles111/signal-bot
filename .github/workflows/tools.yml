name: Bot tools

# Press "Run workflow" in the Actions tab and pick what to do.
# Results are posted to your Discord channel.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        default: backtest
        options:
          - backtest
          - test-discord

jobs:
  tool:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run ${{ inputs.task }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: |
          if [ "${{ inputs.task }}" = "backtest" ]; then
            python bot.py backtest --discord
          else
            python bot.py test-discord
          fi
