name: Fetch research data

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "730"

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download history
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python tools/fetch_data.py ${{ inputs.days }}
      - uses: actions/upload-artifact@v4
        with:
          name: price-data
          path: data/
          retention-days: 3
