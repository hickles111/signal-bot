name: Strategy research

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history"
        default: "730"
      script:
        description: "Research script"
        default: "research.py"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run research
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAYS: ${{ inputs.days }}
        run: |
          set -o pipefail
          python tools/${{ inputs.script }} 2>&1 | tee research_log.txt
      - name: Save results to the research branch
        if: always()
        run: |
          cp research_log.txt /tmp/ || true
          cp research_results.md /tmp/ || echo "no results" > /tmp/research_results.md
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git checkout --orphan research
          git rm -rfq .
          cp /tmp/research_results.md /tmp/research_log.txt .
          git add research_results.md research_log.txt
          git commit -qm "Research results"
          git push -f origin research
