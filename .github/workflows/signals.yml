name: Signal check

on:
  schedule:
    # Every 5 minutes (GitHub often runs these late or skips some), Sunday to Friday (UTC)
    - cron: "1-59/5 * * * 0-5"
  workflow_dispatch:   # lets you press "Run workflow" by hand

permissions:
  contents: write      # needed to save the bot's trade tracking

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the market
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
        run: python bot.py check

      - name: Save trade tracking
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update bot state" -q
            git pull --rebase -q || true
            git push -q
          fi
